<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akash Academy | Coaching Management</title>
<style>
:root{--navy:#14233b;--blue:#2563eb;--bg:#f4f7fb;--ink:#182338;--muted:#64748b;--line:#e4eaf2;--white:#fff;--green:#15803d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:flex;min-height:100vh}.side{width:248px;background:var(--navy);color:#fff;padding:24px 16px;flex-shrink:0}
.brand{font-size:19px;font-weight:800;letter-spacing:.4px;padding:0 12px 24px}.brand small{display:block;color:#aab8ce;font-size:11px;font-weight:500;margin-top:5px}
.navlabel{font-size:10px;color:#91a3bd;text-transform:uppercase;letter-spacing:1.4px;padding:14px 12px 8px}
.nav button{width:100%;border:0;background:transparent;color:#d7e1ef;text-align:left;padding:11px 12px;border-radius:9px;font-size:14px;cursor:pointer;margin:2px 0}
.nav button.active,.nav button:hover{background:#263b5b;color:#fff}.nav button span{display:inline-block;width:25px}
.main{flex:1;min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}
.top .crumb{font-size:13px;color:var(--muted)}.avatar{width:34px;height:34px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-weight:800}
.content{padding:28px;max-width:1250px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
h1{font-size:25px;margin:0 0 7px}h2{font-size:17px;margin:0 0 14px}p.sub{margin:0;color:var(--muted);font-size:13px}
.btn{border:0;border-radius:9px;padding:10px 15px;background:var(--blue);color:#fff;font-weight:650;font-size:13px;cursor:pointer}
.btn.secondary{background:#eaf0f8;color:#25344c}.btn.dark{background:var(--navy)}.btn.danger{background:#fee2e2;color:#991b1b}.btn:disabled{opacity:.45;cursor:not-allowed}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.metric{font-size:27px;font-weight:800;margin:8px 0 3px}.muted{color:var(--muted);font-size:12px}.metric-icon{font-size:19px}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:11px;text-align:left;padding:15px;cursor:pointer;color:var(--ink)}
.quick b{display:block;margin:6px 0;font-size:13px}.quick small{color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:12px;font-weight:700;color:#34445c}
input,select,textarea{width:100%;border:1px solid #d8e0eb;border-radius:8px;padding:10px 11px;font:13px inherit;color:var(--ink);background:#fff}
textarea{min-height:86px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}
.question{border:1px solid var(--line);border-radius:10px;padding:12px;margin:9px 0;display:flex;gap:10px;align-items:flex-start}
.question input{width:auto;margin-top:3px}.question .qbody{flex:1;font-size:13px;line-height:1.5}.question small{display:block;color:var(--muted);margin-top:5px}
.notice{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:10px;padding:12px;font-size:12px;line-height:1.5;margin-bottom:15px}
.hidden{display:none!important}.testpaper{background:white;padding:28px;border:1px solid var(--line);border-radius:12px;max-width:800px;margin:0 auto}
.testpaper h2{text-align:center}.testpaper .center{text-align:center}.testpaper .paperq{margin:15px 0;line-height:1.6;font-size:14px}
footer{color:var(--muted);font-size:11px;padding:22px 0;text-align:center}
@media(max-width:850px){.side{width:205px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:600px){.app{display:block}.side{width:100%;padding:12px}.brand{padding:6px 10px 12px}.nav{display:flex;overflow:auto}.navlabel{display:none}.nav button{white-space:nowrap;width:auto;padding:9px}.top{height:54px;padding:0 15px}.content{padding:18px 13px}.heading{display:block}.heading .btn{margin-top:14px}.cards{gap:8px}.card{padding:13px}.metric{font-size:22px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
@media print{body{background:#fff}.side,.top,.no-print{display:none!important}.main,.content{padding:0;margin:0;max-width:none}.testpaper{border:0;padding:0}.paperq{break-inside:avoid}}
</style></head>
<body>
<div class="app">
<aside class="side">
 <div class="brand">AKASH ACADEMY<small>COACHING MANAGEMENT</small></div>
 <div class="navlabel">Workspace</div>
 <nav class="nav">
  <button class="active" data-page="dashboard"><span>▦</span>Dashboard</button>
  <button data-page="materials"><span>▤</span>Study Library</button>
  <button data-page="questions"><span>☷</span>Question Bank</button>
  <button data-page="tests"><span>▣</span>Test Generator</button>
  <button data-page="students"><span>♙</span>Students</button>
  <button data-page="results"><span>▥</span>Results</button>
 </nav>
 <div class="navlabel">System</div>
 <nav class="nav"><button data-page="settings"><span>⚙</span>Settings & Data</button></nav>
</aside>
<main class="main">
 <header class="top"><div class="crumb" id="crumb">Workspace / Dashboard</div><div style="display:flex;align-items:center;gap:10px"><span class="muted">Teacher account</span><div class="avatar">A</div></div></header>
 <div class="content" id="content"></div>
</main></div>
<script>
const KEY='akashAcademy_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{materials:[],questions:[],tests:[],students:[],results:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function page(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render(p)}
let current='dashboard';
document.querySelectorAll('.nav button[data-page]').forEach(b=>b.addEventListener('click',()=>page(b.dataset.page)));
function shell(title,sub,action=''){return `<div class="heading"><div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function metric(n,label,ico){return `<div class="card"><div class="metric-icon">${ico}</div><div class="metric">${n}</div><div class="muted">${label}</div></div>`}
function render(p=current){current=p;const c=document.getElementById('content');document.getElementById('crumb').textContent='Workspace / '+p[0].toUpperCase()+p.slice(1);
if(p==='dashboard'){c.innerHTML=shell('Good day, Teacher 👋','Your coaching class workspace at a glance.')+
`<div class="cards">${metric(db.students.length,'Students','♙')}${metric(db.materials.length,'Uploaded resources','▤')}${metric(db.questions.length,'Question bank entries','☷')}${metric(db.tests.length,'Tests created','▣')}</div>
<div class="grid2"><div class="panel"><h2>Quick actions</h2><div class="quick">
<button onclick="page('materials')">📚<b>Upload study material</b><small>PDFs, notes, worksheets</small></button>
<button onclick="page('questions')">✍️<b>Add questions</b><small>Build your reusable bank</small></button>
<button onclick="page('tests')">📝<b>Create a test</b><small>Chapterwise or portionwise</small></button>
<button onclick="page('students')">👥<b>Add students</b><small>Manage your class list</small></button></div></div>
<div class="panel"><h2>Recent tests</h2>${db.tests.length?`<table><tr><th>Test</th><th>Marks</th><th>Date</th></tr>${db.tests.slice(-5).reverse().map(t=>`<tr><td>${esc(t.name)}</td><td>${t.marks}</td><td>${esc(t.date)}</td></tr>`).join('')}</table>`:'<div class="empty">No tests created yet. Start with Test Generator.</div>'}</div></div>
<div class="notice" style="margin-top:16px"><b>Local prototype:</b> Your data is saved in this browser on this device. Cloud sync, secure student logins and multi-device access are not connected yet.</div>`;
}
if(p==='materials'){c.innerHTML=shell('Study Library','Upload and organise teaching resources by grade, subject and chapter.')+
`<div class="panel"><h2>Upload resource</h2><form id="matForm" class="formgrid">
<div class="field"><label>Grade</label><select name="grade"><option>Grade 8</option><option>Grade 9</option><option selected>Grade 10</option></select></div>
<div class="field"><label>Subject</label><input name="subject" value="Mathematics" required></div>
<div class="field"><label>Chapter / Topic</label><input name="chapter" placeholder="e.g. Quadratic Equations" required></div>
<div class="field"><label>Resource type</label><select name="type"><option>Notes</option><option>Question Paper</option><option>Worksheet</option><option>Answer Key</option><option>Other</option></select></div>
<div class="field full"><label>Select file</label><input type="file" name="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png" required></div>
<div class="field full"><button class="btn">Save resource</button></div></form></div>
<div class="panel" style="margin-top:16px"><h2>Uploaded resources (${db.materials.length})</h2>${db.materials.length?`<table><tr><th>Resource</th><th>Grade / Subject</th><th>Chapter</th><th>Type</th><th></th></tr>${db.materials.map((m,i)=>`<tr><td>${esc(m.name)}</td><td>${esc(m.grade)} · ${esc(m.subject)}</td><td>${esc(m.chapter)}</td><td>${esc(m.type)}</td><td><button class="btn danger" onclick="del('materials',${i})">Remove</button></td></tr>`).join('')}</table>`:'<div class="empty">No files uploaded yet.</div>'}</div>`;
document.getElementById('matForm').onsubmit=async e=>{e.preventDefault();let f=e.target.file.files[0];if(f.size>4*1024*1024){alert('For this local prototype, please use files up to 4 MB.');return}let data=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});db.materials.push({name:f.name,data,grade:e.target.grade.value,subject:e.target.subject.value,chapter:e.target.chapter.value,type:e.target.type.value,size:f.size});save();};
}
if(p==='questions'){c.innerHTML=shell('Question Bank','Create a tagged question repository for reusable test generation.')+
`<div class="panel"><h2>Add a question</h2><form id="qForm" class="formgrid">
<div class="field"><label>Grade</label><select name="grade"><option>Grade 8</option><option>Grade 9</option><option selected>Grade 10</option></select></div>
<div class="field"><label>Subject</label><input name="subject" value="Mathematics"></div>
<div class="field"><label>Chapter</label><select name="chapter"><option>Quadratic Equations</option><option>Triangles</option><option>Real Numbers</option><option>Polynomials</option><option>Other</option></select></div>
<div class="field"><label>Question type</label><select name="type"><option>MCQ</option><option>Very Short Answer</option><option>Short Answer</option><option>Long Answer</option><option>Case Study</option></select></div>
<div class="field"><label>Marks</label><input type="number" name="marks" min="1" max="20" value="1" required></div>
<div class="field"><label>Difficulty</label><select name="difficulty"><option>Easy</option><option selected>Medium</option><option>Difficult</option></select></div>
<div class="field full"><label>Question text</label><textarea name="text" required placeholder="Enter the question. You may use standard mathematical notation."></textarea></div>
<div class="field full"><label>Answer / solution (teacher only)</label><textarea name="answer" placeholder="Enter correct answer and working"></textarea></div>
<div class="field full"><button class="btn">Add to question bank</button></div></form></div>
<div class="panel" style="margin-top:16px"><h2>Saved questions (${db.questions.length})</h2>${db.questions.length?`<table><tr><th>Question</th><th>Chapter</th><th>Type</th><th>Marks</th><th>Level</th><th></th></tr>${db.questions.map((q,i)=>`<tr><td>${esc(q.text)}</td><td>${esc(q.chapter)}</td><td>${esc(q.type)}</td><td>${q.marks}</td><td>${esc(q.difficulty)}</td><td><button class="btn danger" onclick="del('questions',${i})">Remove</button></td></tr>`).join('')}</table>`:'<div class="empty">Your question bank is empty. Add questions to generate tests from your own material.</div>'}</div>`;
document.getElementById('qForm').onsubmit=e=>{e.preventDefault();let f=e.target;db.questions.push({grade:f.grade.value,subject:f.subject.value,chapter:f.chapter.value,type:f.type.value,marks:+f.marks.value,difficulty:f.difficulty.value,text:f.text.value,answer:f.answer.value});save()};
}
if(p==='tests'){let qcount=db.questions.length;c.innerHTML=shell('Test Generator','Build chapterwise or portionwise assessments from your question bank.')+
`<div class="notice">The selected blueprint is preloaded: Grade 10 Mathematics · Quadratic Equations + Triangles · 40 marks · 60 minutes · Medium. Add your own questions in Question Bank to populate this generator.</div>
<div class="panel"><h2>Test settings</h2><form id="testForm" class="formgrid">
<div class="field full"><label>Test name</label><input name="name" value="Grade 10 Mathematics – Chapter Test" required></div>
<div class="field"><label>Grade</label><select name="grade"><option selected>Grade 10</option><option>Grade 9</option><option>Grade 8</option></select></div>
<div class="field"><label>Subject</label><input name="subject" value="Mathematics"></div>
<div class="field"><label>Chapters / portion</label><select name="chapter"><option>Both chapters</option><option>Quadratic Equations</option><option>Triangles</option></select></div>
<div class="field"><label>Difficulty</label><select name="difficulty"><option>Easy</option><option selected>Medium</option><option>Difficult</option><option>Mixed</option></select></div>
<div class="field"><label>Total marks</label><input name="marks" type="number" value="40" min="1" required></div>
<div class="field"><label>Duration (minutes)</label><input name="duration" type="number" value="60" min="1" required></div>
<div class="field full"><label>Question selection</label><select name="selection"><option>Choose questions manually</option><option>All matching questions</option></select></div>
<div class="field full"><button class="btn">Load matching questions</button></div></form></div>
<div class="panel" id="picker" style="margin-top:16px"><h2>Question selection</h2><div class="empty">Set your test options and load matching questions.</div></div>
<div class="panel" id="paper" style="margin-top:16px"><div class="empty">Your generated test preview will appear here.</div></div>
<div class="panel" style="margin-top:16px"><h2>Saved tests (${db.tests.length})</h2>${db.tests.length?`<table><tr><th>Test</th><th>Chapters</th><th>Marks</th><th>Duration</th><th></th></tr>${db.tests.map((t,i)=>`<tr><td>${esc(t.name)}</td><td>${esc(t.chapter)}</td><td>${t.marks}</td><td>${t.duration} min</td><td><button class="btn secondary" onclick="showSaved(${i})">Preview</button> <button class="btn danger" onclick="del('tests',${i})">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">No saved tests.</div>'}</div>`;
let form=document.getElementById('testForm');
form.onsubmit=e=>{e.preventDefault();let f=form, ch=f.chapter.value, matches=db.questions.filter(q=>q.grade===f.grade.value&&q.subject.toLowerCase()===f.subject.value.toLowerCase()&&(ch==='Both chapters'?['Quadratic Equations','Triangles'].includes(q.chapter):q.chapter===ch));let picked=new Set();let picker=document.getElementById('picker');picker.innerHTML=`<h2>Choose questions (${matches.length} available)</h2>${matches.length?matches.map((q,i)=>`<label class="question"><input type="checkbox" data-qi="${db.questions.indexOf(q)}"><span class="qbody">${esc(q.text)}<small>${esc(q.chapter)} · ${esc(q.type)} · ${q.marks} mark(s) · ${esc(q.difficulty)}</small></span></label>`).join(''):'<div class="empty">No matching questions found. Add questions under Question Bank first. You can still create and print a blank test shell.</div>'}<div class="actions"><button class="btn" id="buildPaper">Generate test preview</button></div>`;
document.getElementById('buildPaper').onclick=()=>{let ids=[...picker.querySelectorAll('input:checked')].map(x=>+x.dataset.qi);let chosen=ids.map(i=>db.questions[i]);let test={name:f.name.value,grade:f.grade.value,subject:f.subject.value,chapter:ch,difficulty:f.difficulty.value,marks:+f.marks.value,duration:+f.duration.value,questions:chosen,date:new Date().toLocaleDateString()};db.tests.push(test);localStorage.setItem(KEY,JSON.stringify(db));showPaper(test);renderSavedTests();};
};
}
function showPaper(t){let paper=document.getElementById('paper');if(!paper)return;paper.innerHTML=`<div class="no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px"><h2>Generated paper preview</h2><button class="btn" onclick="window.print()">Print / Save as PDF</button></div><div class="testpaper"><h2>AKASH ACADEMY</h2><div class="center"><b>${esc(t.name)}</b><br>${esc(t.grade)} ${esc(t.subject)}<br>Chapters: ${esc(t.chapter)}</div><p style="display:flex;justify-content:space-between;border-bottom:1px solid #aaa;padding-bottom:8px"><b>Time: ${t.duration} minutes</b><b>Maximum Marks: ${t.marks}</b></p><p><b>Name:</b> _______________________________ &nbsp; <b>Date:</b> ______________</p><p><b>Instructions:</b> All questions are compulsory unless stated otherwise. Show necessary working. Marks are indicated against each question.</p>${t.questions.length?t.questions.map((q,i)=>`<div class="paperq"><b>Q${i+1}.</b> ${esc(q.text)} <b>[${q.marks}]</b></div>`).join(''):'<p><i>No questions were selected. Add questions to the bank and generate the test again.</i></p>'}</div>`}
function showSaved(i){let t=db.tests[i];let paper=document.getElementById('paper');if(paper)showPaper(t);else{page('tests');setTimeout(()=>showPaper(t),20)}}
function renderSavedTests(){let p=document.getElementById('paper');if(p)p.scrollIntoView({behavior:'smooth',block:'start'})}
if(p==='students'){c.innerHTML=shell('Students','Maintain your coaching class student list.')+
`<div class="panel"><h2>Add student</h2><form id="stuForm" class="formgrid"><div class="field"><label>Student name</label><input name="name" required></div><div class="field"><label>Grade / Batch</label><select name="batch"><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option></select></div><div class="field"><label>Parent contact (optional)</label><input name="phone" type="tel"></div><div class="field"><label>Student ID (optional)</label><input name="sid"></div><div class="field full"><button class="btn">Add student</button></div></form></div><div class="panel" style="margin-top:16px"><h2>Student list (${db.students.length})</h2>${db.students.length?`<table><tr><th>Name</th><th>Batch</th><th>Contact</th><th>ID</th><th></th></tr>${db.students.map((s,i)=>`<tr><td>${esc(s.name)}</td><td>${esc(s.batch)}</td><td>${esc(s.phone)}</td><td>${esc(s.sid)}</td><td><button class="btn danger" onclick="del('students',${i})">Remove</button></td></tr>`).join('')}</table>`:'<div class="empty">No students added yet.</div>'}</div>`;
document.getElementById('stuForm').onsubmit=e=>{e.preventDefault();let f=e.target;db.students.push({name:f.name.value,batch:f.batch.value,phone:f.phone.value,sid:f.sid.value});save()};
}
if(p==='results'){c.innerHTML=shell('Results & Performance','Record marks and review student performance.')+
`<div class="panel"><h2>Record a test result</h2><form id="resForm" class="formgrid"><div class="field"><label>Student</label><select name="student">${db.students.map((s,i)=>`<option value="${i}">${esc(s.name)} – ${esc(s.batch)}</option>`).join('')}</select></div><div class="field"><label>Test</label><select name="test">${db.tests.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Marks obtained</label><input name="score" type="number" min="0" step=".5" required></div><div class="field full"><button class="btn" ${(!db.students.length||!db.tests.length)?'disabled':''}>Save result</button></div></form></div><div class="panel" style="margin-top:16px"><h2>Result register</h2>${db.results.length?`<table><tr><th>Student</th><th>Test</th><th>Score</th><th>Percentage</th></tr>${db.results.map(r=>`<tr><td>${esc(r.student)}</td><td>${esc(r.test)}</td><td>${r.score}/${r.total}</td><td>${(100*r.score/r.total).toFixed(1)}%</td></tr>`).join('')}</table>`:'<div class="empty">No results recorded.</div>'}</div>`;
document.getElementById('resForm').onsubmit=e=>{e.preventDefault();let f=e.target,s=db.students[+f.student.value],t=db.tests[+f.test.value],score=+f.score.value;if(!s||!t||score<0||score>t.marks){alert('Check student, test and score.');return}db.results.push({student:s.name,test:t.name,score,total:t.marks});save()};
}
if(p==='settings'){c.innerHTML=shell('Settings & Data','Export a backup or clear this browser’s saved coaching data.')+
`<div class="panel"><h2>Data management</h2><p class="muted">Export your data as JSON so you can keep a backup. Uploaded file contents are included and may make the backup large.</p><div class="actions"><button class="btn" onclick="exportData()">Export backup</button><label class="btn secondary" style="cursor:pointer">Import backup<input type="file" accept=".json,application/json" onchange="importData(event)" hidden></label><button class="btn danger" onclick="clearData()">Clear all local data</button></div></div><div class="notice" style="margin-top:16px"><b>Current limitation:</b> This is a single-device prototype. It does not yet provide secure accounts, cloud storage, live student access, online submissions, automatic PDF question extraction or AI question generation. Do not store sensitive student information in this prototype.</div>`}
}
function del(key,i){if(confirm('Remove this entry?')){db[key].splice(i,1);save()}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='akash-academy-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.materials||!x.questions||!x.tests)throw 0;db=x;save();alert('Backup imported.')}catch(_){alert('Invalid backup file.')}};r.readAsText(f)}
function clearData(){if(confirm('This permanently clears all data stored by this prototype in this browser. Continue?')){db={materials:[],questions:[],tests:[],students:[],results:[]};save()}}
render();
</script></body></html>
